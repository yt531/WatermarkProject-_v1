<div class="w-full">
  <div class="mb-4">
    <label class="text-[13px] font-bold text-[#555] block mb-1">匯出檔名設定：</label>
    <input type="text" [value]="stateService.outputFileName()" (input)="updateName($event)" placeholder="輸入檔名" class="w-full py-2 px-2 mb-3 border border-[#888] rounded text-[13px] focus:border-(--color-primary) focus:outline-none">
    
    <label class="text-[13px] font-bold text-[#555] block mb-1">匯出格式：</label>
    <div class="flex bg-[#f0f0f0] rounded overflow-hidden border border-[#ccc]">
      <button (click)="setFormat('auto')" [class]="getFormatBtnClass('auto')" class="flex-1 py-1.5 text-[12px] font-medium transition-colors border-none outline-none cursor-pointer">自動</button>
      <button (click)="setFormat('png')" [class]="getFormatBtnClass('png')" class="flex-1 py-1.5 text-[12px] font-medium transition-colors border-none outline-none cursor-pointer border-l border-[#ccc]">PNG</button>
      <button (click)="setFormat('jpg')" [class]="getFormatBtnClass('jpg')" class="flex-1 py-1.5 text-[12px] font-medium transition-colors border-none outline-none cursor-pointer border-l border-[#ccc]">JPG</button>
      <button (click)="setFormat('pdf')" [class]="getFormatBtnClass('pdf')" class="flex-1 py-1.5 text-[12px] font-medium transition-colors border-none outline-none cursor-pointer border-l border-[#ccc]">PDF</button>
    </div>
  </div>
  <button class="w-full p-3 bg-[#28a745] hover:bg-[#218838] transition-colors text-white border-none rounded text-[16px] font-bold cursor-pointer disabled:bg-[#ccc] disabled:cursor-not-allowed flex items-center justify-center gap-2"
          [disabled]="!stateService.isLoaded() || isProcessing"
          (click)="processAll()">
    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5">
      <path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5M16.5 12L12 16.5m0 0L7.5 12m4.5 4.5V3" />
    </svg>
    {{ isProcessing ? '處理中...' : '匯出檔案' }}
  </button>
  <div class="text-center text-[12px] mt-[5px] text-[#666]">{{ statusMsg }}</div>
</div>
