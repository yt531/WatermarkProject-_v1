<fieldset class="border border-[#d0d0d0] rounded p-2.5 m-0">
  <legend class="text-[14px] text-[#555] font-bold px-1 max-md:sr-only">用途</legend>
  <div class="flex bg-[#eee] rounded p-[2px]">
    <button
      [class]="getBtnClass('general')"
      (click)="setUsageMode('general')">
      一般文件
    </button>
    <button
      [class]="getBtnClass('idcard')"
      (click)="setUsageMode('idcard')">
      證件保護
    </button>
  </div>
  @if (stateService.usageMode() === 'idcard') {
    <div class="text-[14px] text-[#d9534f] mt-2">
      拖曳預覽圖上的紅框，框內不加浮水印。
    </div>
  }
</fieldset>
