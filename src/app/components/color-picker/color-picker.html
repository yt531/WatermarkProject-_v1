<fieldset class="border border-[#d0d0d0] rounded p-2.5 m-0 relative">
  <legend class="text-[12px] text-(--color-primary) font-bold px-1">文字顏色</legend>
  <div class="relative color-control-wrapper">
    <button
      class="w-full p-2 bg-white border border-[#ccc] rounded cursor-pointer flex items-center gap-2.5 transition-colors duration-200 hover:bg-[#f0f0f0] hover:border-(--color-primary) max-md:min-h-[44px]"
      (click)="toggleMenu()">
      <span class="w-6 h-6 bg-[#eee] rounded flex items-center justify-center font-bold border-b-4 font-serif"
        [style.borderBottomColor]="stateService.watermarkColor()" [style.color]="stateService.watermarkColor()">A</span>
      <span class="text-[13px] text-[#444] max-md:text-[14px]">選擇顏色 ▼</span>
    </button>

    @if (menuOpen) {
    <div
      class="z-[1000] bg-white mt-1 p-2.5 rounded md:absolute md:top-full md:left-0 md:border md:border-[#aaa] md:shadow-[0_4px_10px_rgba(0,0,0,0.2)] md:w-[230px] max-md:w-full max-md:static max-md:border max-md:border-gray-200">
      <div class="text-[11px] text-[#666] mb-1 font-bold">主題色彩</div>
      <div class="grid grid-cols-10 gap-[2px] mb-2.5">
        @for (color of themeColorsFlat; track color) {
        <div
          class="w-[18px] h-[18px] border border-transparent cursor-pointer box-border hover:scale-125 hover:border-[#f29b38] hover:bg-clip-padding hover:shadow-[0_0_2px_rgba(0,0,0,0.3)] hover:z-10"
          [style.backgroundColor]="color" [title]="color" (mouseenter)="tempUpdatePreview(color)"
          (mouseleave)="tempUpdatePreview(null)" (click)="selectColor(color)"></div>
        }
      </div>
      <div class="text-[11px] text-[#666] mb-1 font-bold">標準色彩</div>
      <div class="grid grid-cols-10 gap-[2px] mb-1">
        @for (color of standardColors; track color) {
        <div
          class="w-[18px] h-[18px] border border-transparent cursor-pointer box-border hover:scale-125 hover:border-[#f29b38] hover:bg-clip-padding hover:shadow-[0_0_2px_rgba(0,0,0,0.3)] hover:z-10"
          [style.backgroundColor]="color" [title]="color" (mouseenter)="tempUpdatePreview(color)"
          (mouseleave)="tempUpdatePreview(null)" (click)="selectColor(color)"></div>
        }
      </div>

      <div class="h-px bg-[#eee] my-2"></div>

      <div class="text-[11px] text-[#666] mb-1 font-bold cursor-pointer" (click)="toggleCustom()">
        更多顏色 ▶
      </div>

      @if (customOpen) {
      <div class="mt-2 pt-2 border-t border-[#eee]">
        <div class="flex items-center mb-2 gap-2">
          <label class="text-[13px] min-w-[30px] text-[#444]">HEX</label>
          <input type="text" [value]="inputHex" (input)="syncColor('hex', $event)"
            class="w-full py-1 px-2 border border-[#888] rounded text-[13px] focus:border-(--color-primary) focus:outline-none">
          <input type="color" [value]="inputHex" (input)="syncColor('picker', $event)" class="invisible w-0 absolute">
        </div>
        <div class="flex items-center gap-1">
          <label class="text-[13px] min-w-[30px] text-[#444]">RGB</label>
          <input type="number" [value]="inputR" max="255" (input)="syncColor('rgb', $event)"
            class="w-full py-1 px-1 border border-[#888] rounded text-[13px] focus:border-(--color-primary) focus:outline-none">
          <input type="number" [value]="inputG" max="255" (input)="syncColor('rgb', $event)"
            class="w-full py-1 px-1 border border-[#888] rounded text-[13px] focus:border-(--color-primary) focus:outline-none">
          <input type="number" [value]="inputB" max="255" (input)="syncColor('rgb', $event)"
            class="w-full py-1 px-1 border border-[#888] rounded text-[13px] focus:border-(--color-primary) focus:outline-none">
        </div>
      </div>
      }
    </div>
    }
  </div>
</fieldset>
