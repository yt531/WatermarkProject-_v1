<fieldset class="border border-[#d0d0d0] rounded p-2.5 m-0 mb-4">
  <legend class="text-[12px] text-(--color-primary) font-bold px-1">文字外觀</legend>
  <div class="flex items-center mb-2 gap-2">
    <label class="text-[13px] min-w-[60px] text-[#444]">大小</label>
    <div class="flex items-center w-full gap-[5px]">
      <input type="range" min="10" max="200" [value]="stateService.watermarkSize()" (input)="updateNum('size', $event)" class="flex-1 cursor-pointer max-md:min-h-[44px]">
      <input type="number" class="w-[50px] text-right py-1 px-2 border border-[#888] rounded text-[13px] focus:border-(--color-primary) focus:outline-none" [value]="stateService.watermarkSize()" (input)="updateNum('size', $event)">
    </div>
  </div>
  <div class="flex items-center mb-2 gap-2">
    <label class="text-[13px] min-w-[60px] text-[#444]">角度</label>
    <div class="flex items-center w-full gap-[5px]">
      <input type="range" min="0" max="360" [value]="stateService.watermarkRotate()" (input)="updateNum('rotate', $event)" class="flex-1 cursor-pointer max-md:min-h-[44px]">
      <input type="number" class="w-[50px] text-right py-1 px-2 border border-[#888] rounded text-[13px] focus:border-(--color-primary) focus:outline-none" [value]="stateService.watermarkRotate()" (input)="updateNum('rotate', $event)">
    </div>
  </div>
  <div class="flex items-center mb-2 gap-2">
    <label class="text-[13px] min-w-[60px] text-[#444]">透明</label>
    <div class="flex items-center w-full gap-[5px]">
      <input type="range" min="0" max="100" [value]="stateService.watermarkOpacity()" (input)="updateNum('opacity', $event)" class="flex-1 cursor-pointer max-md:min-h-[44px]">
      <input type="number" class="w-[50px] text-right py-1 px-2 border border-[#888] rounded text-[13px] focus:border-(--color-primary) focus:outline-none" [value]="stateService.watermarkOpacity()" (input)="updateNum('opacity', $event)">
      <span class="text-[12px]">%</span>
    </div>
  </div>
</fieldset>

<app-color-picker></app-color-picker>
