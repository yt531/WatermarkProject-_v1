<div class="flex flex-col md:flex-row flex-1 w-full h-full overflow-hidden relative pb-[60px] md:pb-0">
  <app-preview-pane 
    class="w-full h-full md:h-auto md:flex-1 flex-col bg-[var(--color-bg)] relative z-10 shadow-md md:shadow-none md:flex"
    [class.hidden]="activeTab() !== 'preview'"
    [class.flex]="activeTab() === 'preview'">
  </app-preview-pane>
  
  <app-control-pane 
    class="w-full h-full md:w-[380px] md:flex-none md:shrink-0 bg-white md:border-l border-[var(--color-border)] flex-col shadow-[-2px_0_10px_rgba(0,0,0,0.05)] z-20 overflow-y-auto md:overflow-y-visible md:flex"
    [class.hidden]="activeTab() !== 'settings'"
    [class.flex]="activeTab() === 'settings'">
  </app-control-pane>

  <!-- Mobile Bottom Tab Navigation -->
  <div class="md:hidden fixed bottom-0 left-0 right-0 h-[60px] bg-white border-t border-gray-200 flex z-50 shadow-[0_-2px_10px_rgba(0,0,0,0.05)] pb-safe">
    <button 
      (click)="setTab('preview')" 
      class="flex-1 flex flex-col items-center justify-center gap-1 transition-colors"
      [class.text-blue-600]="activeTab() === 'preview'"
      [class.text-gray-500]="activeTab() !== 'preview'">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-6 h-6">

      </svg>
      <span class="text-[11px] font-medium">預覽</span>
    </button>

      [class.text-gray-500]="activeTab() !== 'settings'">
