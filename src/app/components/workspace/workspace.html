<div class="flex flex-col md:flex-row flex-1 w-full h-full overflow-hidden relative">
  <!-- 預覽區：手機版佔據除了底部按鈕外的所有空間 -->
  <div class="flex-1 w-full flex overflow-hidden relative z-10 md:z-10 bg-[var(--color-bg)] shadow-md md:shadow-none pb-[80px] md:pb-0" (click)="onPreviewClick()">
    <app-preview-pane class="w-full h-full flex flex-col"></app-preview-pane>
  </div>
  
  <!-- 控制區：手機版為 full height overlay (pointer-events-none)，電腦版為右側 sidebar -->
  <app-control-pane 
    #controlPane
    class="md:w-[380px] md:flex-none md:shrink-0 bg-transparent md:bg-white md:border-l border-[var(--color-border)] flex-col md:shadow-[-2px_0_10px_rgba(0,0,0,0.05)] z-20 md:overflow-y-auto md:relative absolute inset-0 md:h-full flex pointer-events-none md:pointer-events-auto">
  </app-control-pane>
</div>
