<div class="w-full flex flex-col pointer-events-none md:pointer-events-auto bg-transparent md:bg-white shadow-none md:shadow-[0_-5px_20px_rgba(0,0,0,0.1)] z-50">

  <!-- Panels container (hidden if no panel is active on mobile) -->
  <div class="w-full flex-col pointer-events-none md:pointer-events-auto md:overflow-y-auto"
       [class.flex]="activeMobileMenu !== null"
       [class.hidden]="activeMobileMenu === null"
       [class.md:flex]="true">
    
    <!-- 1. 背景圖 (Upload) -->
    <div [class]="getPanelClass('upload')">
      <div [class]="getHeaderClass()">
        <span class="font-bold text-[14px]">匯入</span>
        <button (click)="closeMobileMenu()" class="p-1 cursor-pointer bg-transparent border-none text-gray-500">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-6 h-6"><path stroke-linecap="round" stroke-linejoin="round" d="M19.5 8.25l-7.5 7.5-7.5-7.5" /></svg>
        </button>
      </div>
      <div class="p-[15px] bg-white flex flex-col gap-4 pointer-events-auto">
        <app-file-uploader></app-file-uploader>
      </div>
    </div>

    <!-- 2. 內容 (Content) -->
    <div [class]="getPanelClass('content')">
      <div [class]="getHeaderClass()">
        <span class="font-bold text-[14px]">浮水印內容</span>
        <button (click)="closeMobileMenu()" class="p-1 cursor-pointer bg-transparent border-none text-gray-500">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-6 h-6"><path stroke-linecap="round" stroke-linejoin="round" d="M19.5 8.25l-7.5 7.5-7.5-7.5" /></svg>
        </button>
      </div>
      <div class="pointer-events-auto">
        @if (stateService.files().length > 1) {
          <div class="p-[15px] border-b border-(--color-border) bg-[#fff] flex justify-between items-center md:shadow-none">
            <div class="text-[13px] font-bold text-[#555]">浮水印套用設定</div>
            <div class="flex bg-[#f0f0f0] rounded overflow-hidden border border-[#ccc]">
              <button [class]="getApplyModeClass('unified')" (click)="stateService.toggleApplyMode('unified')" class="px-3 py-1.5 text-[13px] cursor-pointer transition-colors border-none outline-none">統一設定</button>
              <button [class]="getApplyModeClass('independent')" (click)="stateService.toggleApplyMode('independent')" class="px-3 py-1.5 text-[13px] cursor-pointer transition-colors border-none outline-none border-l border-[#ccc]">獨立設定</button>
            </div>
          </div>
        }
        <div class="p-[15px] border-b border-(--color-border) bg-[#eef3fb]" style="border-bottom: 2px solid #ccdbe8">
          <app-mode-selector></app-mode-selector>
        </div>
        <div class="p-[15px] bg-white">
          <app-watermark-settings></app-watermark-settings>
        </div>
      </div>
    </div>

    <!-- 3. 樣式 (Style) -->
    <div [class]="getPanelClass('style')">
      <div [class]="getHeaderClass()">
        <span class="font-bold text-[14px]">樣式設定</span>
        <button (click)="closeMobileMenu()" class="p-1 cursor-pointer bg-transparent border-none text-gray-500">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-6 h-6"><path stroke-linecap="round" stroke-linejoin="round" d="M19.5 8.25l-7.5 7.5-7.5-7.5" /></svg>
        </button>
      </div>
      <div class="p-[15px] bg-white pointer-events-auto">
        <app-appearance-settings></app-appearance-settings>
      </div>
    </div>

    <!-- 4. 版面 (Layout) -->
    <div [class]="getPanelClass('layout')">
      <div [class]="getHeaderClass()">
        <span class="font-bold text-[14px]">位置與版面</span>
        <button (click)="closeMobileMenu()" class="p-1 cursor-pointer bg-transparent border-none text-gray-500">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-6 h-6"><path stroke-linecap="round" stroke-linejoin="round" d="M19.5 8.25l-7.5 7.5-7.5-7.5" /></svg>
        </button>
      </div>
      <div class="p-[15px] bg-white pointer-events-auto">
        <app-position-density></app-position-density>
      </div>
    </div>

    <!-- 5. 輸出 (Export) -->
    <div [class]="getPanelClass('export')">
      <div [class]="getHeaderClass()">
        <span class="font-bold text-[14px]">匯出設定</span>
        <button (click)="closeMobileMenu()" class="p-1 cursor-pointer bg-transparent border-none text-gray-500">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-6 h-6"><path stroke-linecap="round" stroke-linejoin="round" d="M19.5 8.25l-7.5 7.5-7.5-7.5" /></svg>
        </button>
      </div>
      <div class="p-[15px] bg-white mt-auto shadow-[0_-2px_10px_rgba(0,0,0,0.02)] md:shadow-none pointer-events-auto">
        <app-export-panel></app-export-panel>
      </div>
    </div>
  </div>

  <!-- Mobile Bottom Menu Bar -->
  <div class="md:hidden relative flex-none w-full h-[80px] bg-white border-t border-gray-200 flex z-50 shadow-[0_-2px_10px_rgba(0,0,0,0.05)] pb-[env(safe-area-inset-bottom)] pointer-events-auto">
    <button [class]="getMenuBtnClass('upload')" (click)="toggleMobileMenu('upload')">
      <div class="text-[20px]">📂</div>
      <span class="text-[11px] font-medium">匯入</span>
    </button>
    <button [class]="getMenuBtnClass('content')" (click)="toggleMobileMenu('content')">
      <div class="text-[20px]">📝</div>
      <span class="text-[11px] font-medium">內容</span>
    </button>
    <button [class]="getMenuBtnClass('style')" (click)="toggleMobileMenu('style')">
      <div class="text-[20px]">🎨</div>
      <span class="text-[11px] font-medium">樣式</span>
    </button>
    <button [class]="getMenuBtnClass('layout')" (click)="toggleMobileMenu('layout')">
      <div class="text-[20px]">📐</div>
      <span class="text-[11px] font-medium">版面</span>
    </button>
    <button [class]="getMenuBtnClass('export')" (click)="toggleMobileMenu('export')">
      <div class="text-[20px]">📤</div>
      <span class="text-[11px] font-medium">匯出</span>
    </button>
  </div>

</div>
